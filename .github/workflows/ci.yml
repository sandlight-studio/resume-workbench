name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks git --verbose .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm test

  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Pandoc, Poppler, Pango, and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc poppler-utils libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-noto-cjk fonts-dejavu-core
      - name: Install WeasyPrint
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Build every variant and check page counts
        env:
          RESUME_MAX_PAGES: ${{ vars.RESUME_MAX_PAGES || '1' }}
        run: bash scripts/render-check.sh
